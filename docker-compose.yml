
name: gym-clean

services:
    frontend:
        build: ./frontend
        ports:
            - "3000:5173"
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        environment:
            CHOKIDAR_USEPOLLING: "true"
        depends_on:
            - backend

    backend:
        build: ./backend
        ports:
            - "8001:8000"
        volumes:
            - ./backend:/app
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: academic_db
            DB_USERNAME: academic_user
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.4
        ports:
            - "127.0.0.1:3308:3306"
        environment:
            MYSQL_DATABASE: academic_db
            MYSQL_USER: academic_user
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                - CMD-SHELL
                - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql_data:
    frontend_node_modules: